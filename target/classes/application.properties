spring.application.name=mcp-banco-tdea

# --- Servidor MCP por Stdio ---
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.name=banco-mcp-server
spring.ai.mcp.server.version=1.0.0

# IMPORTANTE: con Stdio, NADA puede escribirse en la consola (stdout),
# porque ese canal es el protocolo MCP. Por eso: sin banner, sin web, log a archivo.
spring.main.web-application-type=none
spring.main.banner-mode=off
logging.pattern.console=
logging.file.name=${user.home}/mcp-banco/logs/mcp-banco.log

# --- Base de datos H2 en archivo ---
spring.datasource.url=jdbc:h2:file:${user.home}/mcp-banco/bancodb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
